<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平板、笔记本配件 · Temu 页面结构仿真</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #222; background: #fff; font: 15px/1.45 Arial, "Microsoft YaHei", sans-serif; }
    header { display: flex; align-items: center; gap: 24px; min-height: 62px; padding: 0 34px; border-bottom: 1px solid #eee; }
    .brand { color: #fb7700; font-size: 24px; font-weight: 800; }
    .search { width: min(480px, 45vw); padding: 11px 16px; border: 1px solid #ddd; border-radius: 22px; background: #fafafa; }
    .layout { display: grid; grid-template-columns: 200px 1fr; gap: 30px; max-width: 1320px; margin: 22px auto; padding: 0 24px; }
    nav { color: #5d625f; }
    nav p { padding: 10px 12px; border-radius: 8px; }
    nav p:first-child { color: #222; background: #f4f4f4; font-weight: 700; }
    h1 { margin: 2px 0 18px; font-size: 22px; }
    .toolbar { display: flex; justify-content: space-between; margin: 16px 0; color: #666; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 18px; }
    .product-card { display: block; overflow: hidden; border-radius: 10px; color: inherit; text-decoration: none; }
    .product-card:hover { box-shadow: 0 3px 14px #0002; }
    .product-card img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; background: #f5f5f5; }
    .product-info { padding: 9px 4px; }
    .product-title { min-height: 42px; margin: 0 0 7px; font-size: 13px; }
    .price { margin: 0; color: #222; font-size: 19px; font-weight: 700; }
    .sold { margin: 5px 0 0; color: #777; font-size: 12px; }
    .decorative { width: 48px; height: 48px; object-fit: contain; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(145px, 1fr)); } }
  </style>
</head>

  <header>

</html>
