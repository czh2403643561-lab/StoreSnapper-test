<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoreSnapper 保存文件夹</title>
  <style>
    :root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#20332c;background:#f4f7f5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(480px,100%);padding:26px;border:1px solid #dce8e1;border-radius:18px;background:#fff;box-shadow:0 12px 36px rgba(14,39,29,.12)}
    .brand{display:flex;align-items:center;gap:11px;margin-bottom:19px}
    .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#e8f4ed;color:#1f7655;font-size:20px;font-weight:700}
    h1{margin:0;font-size:18px}
    p{color:#65776d;font-size:13px;line-height:1.65}
    .folder{margin:16px 0;padding:12px;border-radius:9px;background:#f6f8f7;color:#557065;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
    button{width:100%;min-height:42px;margin-top:9px;border:1px solid #d7e2db;border-radius:9px;background:#fff;color:#35634e;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    button.primary{border:0;background:#247d58;color:#fff}
    button:disabled{opacity:.55;cursor:wait}
    .status{min-height:20px;margin:14px 0 0;color:#397354;font-size:12px;line-height:1.5}
    .status.error{color:#a73737}
    .note{margin-top:18px;font-size:11px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">S</span><h1>选择 1688 ZIP 保存文件夹</h1></div>
    <p>选择一次后，商品 ZIP 会直接写入这里。若选择的是 Google Drive for Desktop 的同步文件夹，Google Drive 会按它自己的同步状态上传。</p>
    <div class="folder">当前文件夹：<strong class="folder-name">尚未选择</strong></div>
    <button class="primary choose" type="button">选择本机文件夹</button>
    <button class="restore" type="button" hidden>恢复此文件夹的访问权限</button>
    <button class="clear" type="button" hidden>清除文件夹设置</button>
    <p class="status" aria-live="polite"></p>
    <p class="note">Chrome 可能在重启后要求重新确认访问权限。选择的文件夹和 ZIP 内容都保存在本机；本插件不会通过 Google API 访问你的云端硬盘。</p>
  </main>
  <script src="folder-settings.js"></script>
</body>
</html>
